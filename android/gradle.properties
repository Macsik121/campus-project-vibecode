org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.caching=true
org.gradle.parallel=true
# Путь проекта содержит кириллицу (C:\Users\максим\...). AGP по умолчанию отказывается
# собирать такой проект; на современных AGP/Windows сборка при этом работает.
android.overridePathCheck=true
# Gradle запускается этой JDK, независимо от того, какая java стоит в PATH
# (на машине в PATH JDK 25/26 — Gradle 8.x падает с «Unsupported class file major version 69»).
# Это JDK 21 из Android Studio — самый надёжный вариант для AGP 8.5.
# Если Android Studio установлена в другое место — поправьте путь или удалите строку,
# тогда нужна JAVA_HOME на JDK 21.
org.gradle.java.home=C\:\\Program Files\\Android\\Android Studio\\jbr
