plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.campus.app'
    compileSdk 34

    defaultConfig {
        applicationId "ru.campus.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        // Адрес API. По умолчанию 10.0.2.2 — это «localhost компьютера» из эмулятора Android.
        // Приоритет: -PcampusApiBaseUrl=... при сборке → campus.apiBaseUrl в android/local.properties
        //            → адрес эмулятора. Примеры:
        //   ./gradlew assembleDebug -PcampusApiBaseUrl=http://192.168.1.50:3000/
        //   echo 'campus.apiBaseUrl=http://192.168.1.50:3000/' >> local.properties
        def localProps = new Properties()
        def localPropsFile = rootProject.file('local.properties')
        if (localPropsFile.exists()) {
            localPropsFile.withInputStream { localProps.load(it) }
        }
        def apiBaseUrl = project.findProperty('campusApiBaseUrl')
                ?: localProps.getProperty('campus.apiBaseUrl')
                ?: "http://10.0.2.2:3000/"
        buildConfigField "String", "BASE_URL", "\"${apiBaseUrl}\""
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'

    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    implementation('io.socket:socket.io-client:2.1.0') {
        exclude group: 'org.json', module: 'json'
    }
}
