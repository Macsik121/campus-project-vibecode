services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: campus
      POSTGRES_DB: campus
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus -d campus"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Порт БД наружу не публикуется: контейнер API ходит к ней по docker-сети
    # (хостнейм db). Windows нередко резервирует диапазоны портов (Hyper-V/WSL),
    # и 5432 тогда не биндится: "socket access forbidden by permissions".
    # Нужен psql с хоста — раскомментируйте блок, выбрав свободный порт:
    # ports:
    #   - "127.0.0.1:5433:5432"

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      PORT: 3000
      # Без sslmode: через внутреннюю docker-сеть соединение идёт по TCP без TLS,
      # а клиент pg по умолчанию TLS не требует. (sslmode=require здесь ломает
      # соединение: "The server does not support SSL connections".)
      DATABASE_URL: postgres://campus:campus@db:5432/campus
      JWT_SECRET: ${JWT_SECRET:-campus-dev-secret-change-me}
      JWT_EXPIRES_IN: 12h
      BASE_DB_TYPE: postgres
    depends_on:
      db:
        condition: service_healthy
    # Подключение телефона по Wi-Fi требует адреса в локальной сети, поэтому порт
    # публикуется на все интерфейсы. Если 3000 занят — поменяйте на "3001:3000"
    # (API снаружи будет на http://<IP>:3001, в android BASE_URL — тот же порт).
    ports:
      - "3000:3000"
    # Миграции применяются при старте; seed — вручную:
    #   docker compose exec server node src/db/seed.js
    restart: unless-stopped

volumes:
  pgdata:
