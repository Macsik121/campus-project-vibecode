services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: campus
      POSTGRES_DB: campus
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus -d campus"]
      interval: 5s
      timeout: 3s
      retries: 10
    # БД публикуется на хосте на 127.0.0.1:5458 (только для локальных клиентов
    # вроде psql; контейнер API ходит к ней по docker-сети по имени db:5432).
    # 5432 на этой машине занят другим проектом (zeer_postgres), а сам порт
    # ограничен loopback-адресом, чтобы БД не была доступна из локальной сети.
    ports:
      - "127.0.0.1:5458:5432"

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      # Внутри контейнера приложение всегда слушает 3000; наружу порт публикуется
      # как API_PORT (по умолчанию 3008, см. ниже).
      PORT: 3000
      # Без sslmode: через внутреннюю docker-сеть соединение идёт по TCP без TLS,
      # а клиент pg по умолчанию TLS не требует. (sslmode=require здесь ломает
      # соединение: "The server does not support SSL connections".)
      DATABASE_URL: postgres://campus:campus@db:5432/campus
      JWT_SECRET: ${JWT_SECRET:-campus-dev-secret-change-me}
      JWT_EXPIRES_IN: 12h
      BASE_DB_TYPE: postgres
    depends_on:
      db:
        condition: service_healthy
    # Подключение телефона по Wi-Fi требует адреса в локальной сети, поэтому порт
    # публикуется на все интерфейсы.
    # Порт задаётся переменной API_PORT (по умолчанию 3008). 3000 на этой машине
    # постоянно занимает ДРУГОЙ контейнер (zeer_api), из-за чего старт падал с
    # "port is already allocated".
    # API снаружи будет на http://<IP>:${API_PORT}; в Android BASE_URL — тот же порт.
    # API_PORT задаётся в shell (`API_PORT=3009 docker compose up`) или в корневом .env;
    # по умолчанию 3008. server/.env сюда НЕ подключается: там DATABASE_URL на
    # localhost:5432 — внутри контейнера это сломает подключение к БД.
    ports:
      - "${API_PORT:-3008}:3000"
    # Миграции применяются при старте; seed — вручную:
    #   docker compose exec server node src/db/seed.js
    restart: unless-stopped

volumes:
  pgdata:
